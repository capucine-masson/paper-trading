[market]
# Allowed symbols (long only).
symbols = ["SPY", "QQQ", "XLE", "XLF", "XLU", "TLT", "GLD", "EEM"]
# Alpaca market data feed (iex is free; sip needs a paid plan).
feed = "iex"
# Calendar days of hourly history requested from Alpaca.
history_days = 90
# Maximum age in hours of the last bar before data is rejected as stale.
max_bar_age_hours = 2.5
# Maximum share of missing hourly slots tolerated in the context window.
max_gap_ratio = 0.2

[forecast]
# Timestral model on the Hugging Face Hub.
model = "mistralai/Timestral-28M"
# Number of most recent hourly bars given as context.
context_length = 400
# Forecast horizon in hourly steps.
horizon = 6
# Signal (expected return over interval width) that counts as strong: the 90th percentile of the
# absolute signal over the backtest points before the decision window. Signal strength is the
# absolute signal divided by this value, capped at 1.
signal_strong = 0.079
# Attempts to download the model weights on transient errors (network, 429, 5xx).
max_attempts = 3
# Delay in seconds before the first retry (doubles each time).
retry_delay_s = 2.0
# Scheduled macro releases (UTC) given to Timestral as a known-future covariate: FOMC decisions
# (14:00 ET) and CPI releases (08:30 ET), from federalreserve.gov and bls.gov.
event_times = [
  2026-03-11T12:30:00Z, 2026-03-18T18:00:00Z, 2026-04-10T12:30:00Z, 2026-04-29T18:00:00Z,
  2026-05-12T12:30:00Z, 2026-06-10T12:30:00Z, 2026-06-17T18:00:00Z, 2026-07-14T12:30:00Z,
  2026-07-29T18:00:00Z, 2026-08-12T12:30:00Z, 2026-09-11T12:30:00Z, 2026-09-16T18:00:00Z,
  2026-10-14T12:30:00Z, 2026-10-28T18:00:00Z, 2026-11-10T13:30:00Z, 2026-12-09T19:00:00Z,
  2026-12-10T13:30:00Z,
]

[macro]
# Daily macro drivers given to Timestral as past covariates (name = FRED series ID).
# The dollar is the Fed broad index (DTWEXBGS), the free substitute for the ICE DXY.
series = { brent = "DCOILBRENTEU", us10y = "DGS10", us2y = "DGS2", dollar = "DTWEXBGS", vix = "VIXCLS", hy_spread = "BAMLH0A0HYM2" }
# Calendar days of daily history requested from FRED (must cover the context window).
history_days = 120
# Timeout in seconds of one FRED call.
timeout_s = 20
# Attempts on transient errors (network, 429, 5xx).
max_attempts = 3
# Delay in seconds before the first retry (doubles each time).
retry_delay_s = 2.0

[llm]
# Mistral model ID used for decisions.
model = "mistral-small-2603"
# Sampling temperature (low for stable decisions).
temperature = 0.2
# Timeout in seconds of one LLM call.
timeout_s = 30
# Attempts on transient errors (network, 429, 5xx).
max_attempts = 3
# Delay in seconds before the first retry (doubles each time).
retry_delay_s = 2.0

[risk]
# Emergency stop: false blocks every order.
enabled = true
# Capital in USD allocated to the agent; all limits are computed on it.
allocated_capital = 10000.0
# Agent equity in USD below which the agent halts (sticky, manual resume).
capital_floor = 8000.0
# Maximum daily loss as a percentage of allocated capital; beyond it, no more buys that day.
max_daily_loss_pct = 10.0
# Maximum size of one position as a percentage of allocated capital.
max_position_pct = 30.0
# Maximum total exposure as a percentage of allocated capital.
max_total_exposure_pct = 80.0
# Minimum size of a buy order as a percentage of allocated capital (smaller orders are skipped).
min_order_pct = 1.0
# Maximum number of orders per cycle.
max_orders_per_cycle = 5
# Minimum signal strength (0 to 1, computed from the forecast) to buy.
min_signal_strength = 0.5
# Maximum forecast uncertainty (interval width over median) to buy.
max_uncertainty = 0.08
# Block a buy when the forecast expects no gain or the signal is weak.
forecast_guard = true

[broker]
# Timeout in seconds of one Alpaca call.
timeout_s = 20
# Attempts on transient Alpaca errors (network, 429, 5xx).
max_attempts = 3
# Delay in seconds before the first retry (doubles each time).
retry_delay_s = 2.0
# Times an order is read back at the end of a cycle to record its fill.
fill_check_attempts = 5
# Seconds between two of these reads.
fill_check_interval_s = 2.0

[backtest]
# Calendar days of hourly history replayed by the backtest.
history_days = 180
# Number of hourly bars between two evaluation points.
stride_bars = 3
# First evaluation time (UTC): forecast quality and decisions are both replayed from here, after
# the release of Timestral (2026-10-15).
start = 2026-10-16T00:00:00Z
# Other Timestral models whose forecast quality is compared with the main model (no decisions).
compare_models = ["mistralai/Timestral-209M"]
# Timestral-only rule: act when the expected return exceeds this share of the interval width
# (75th percentile of the absolute signal before the decision window).
rule_signal_threshold = 0.047
# Simulated cost per order in basis points of the traded amount (spread and slippage).
cost_bps = 5
