name: cycle

on:
  schedule:
    # Hourly during the US session (UTC), minute offset from :00. Market open/closed comes from the Alpaca clock.
    - cron: "7 14-20 * * 1-5"
  workflow_dispatch:
    inputs:
      resume:
        description: "Clear the halted state before running (manual resume)"
        type: boolean
        default: false

# One cycle at a time: the journal is a single file committed back to the repository.
concurrency:
  group: cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RESUME: ${{ inputs.resume }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache Timestral weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timestral-${{ hashFiles('config.toml') }}

      - run: uv sync --frozen

      - name: Run one cycle
        run: |
          if [ "$RESUME" = "true" ]; then
            uv run python -m agent.run --once --execute --resume
          else
            uv run python -m agent.run --once --execute
          fi

      - name: Commit the journal (even on failure)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal.db
          if git diff --cached --quiet; then
            echo "No journal change."
            exit 0
          fi
          git commit -m "Update journal ($(date -u +%Y-%m-%dT%H:%MZ))"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not push the journal." >&2
          exit 1
