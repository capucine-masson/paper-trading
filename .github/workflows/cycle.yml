name: cycle

on:
  schedule:
    # Hourly during the US session, minute offset from :00. The cron is in UTC and fixed: the US market
    # opens at 14:30 UTC in winter (EST) and 13:30 UTC in summer (EDT). 15:07 is the first slot with a
    # completed hourly bar in winter. In summer, change it to "7 14-19 * * 1-5".
    # Fallback only: GitHub may delay or drop scheduled runs, so the main trigger is an external cron
    # calling workflow_dispatch (see GETTING_STARTED.md, "B").
    # Market open/closed always comes from the Alpaca clock, never from the cron.
    - cron: "7 15-20 * * 1-5"
  workflow_dispatch:
    inputs:
      resume:
        description: "Clear the halted state before running (manual resume)"
        type: boolean
        default: false
      cycle_id:
        description: "Resume a specific cycle, without the sim- prefix (e.g. 20261116T15); default: the current UTC hour"
        type: string
        default: ""
      simulate:
        description: "Dry run: one full cycle without any order, market clock ignored (kept out of the dashboard)"
        type: boolean
        default: false

# One cycle at a time: the journal is a single file committed back to the repository.
concurrency:
  group: cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RESUME: ${{ inputs.resume }}
      SIMULATE: ${{ inputs.simulate }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Cache Timestral weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timestral-${{ hashFiles('config.toml') }}

      - run: uv sync --frozen

      # A failed cycle is re-run with the same cycle id: journaled steps are read back, so no external
      # action (LLM call, order) is repeated. Stays within the cycle's UTC hour, so data is still fresh.
      - name: Run one cycle (resumed in place on failure)
        timeout-minutes: 15
        env:
          CYCLE_ID_INPUT: ${{ inputs.cycle_id }}
        run: |
          EXIT_CYCLE_ERROR=2  # exit code of agent.run for a cycle that ran and failed (agent/run.py)
          MAX_RETRIES=2
          RETRY_DELAY_SECONDS=30
          if [ "$SIMULATE" = "true" ]; then
            args="--ignore-market-clock"
            prefix="sim-"
          else
            args="--execute"
            prefix=""
          fi
          cycle_id="${prefix}${CYCLE_ID_INPUT:-$(date -u +%Y%m%dT%H)}"
          resume_arg=""
          if [ "$RESUME" = "true" ]; then
            resume_arg="--resume"  # first attempt only: a retry must not clear a halt it just raised
          fi
          for attempt in $(seq 0 "$MAX_RETRIES"); do
            status=0
            uv run python -m agent.run $args --cycle-id "$cycle_id" $resume_arg || status=$?
            if [ "$status" -ne "$EXIT_CYCLE_ERROR" ] || [ "$attempt" -eq "$MAX_RETRIES" ]; then
              exit "$status"
            fi
            resume_arg=""
            echo "Cycle $cycle_id failed (attempt $((attempt + 1))), resuming in $((RETRY_DELAY_SECONDS * (attempt + 1)))s."
            sleep $((RETRY_DELAY_SECONDS * (attempt + 1)))
          done

      - name: Export dashboard data (even on failure)
        if: always()
        run: uv run python -m agent.export

      - name: Commit the journal and exports (even on failure)
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal.db web/public/data
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Update journal and exports ($(date -u +%Y-%m-%dT%H:%MZ))"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true  # leave a clean tree for the next attempt
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the journal and exports; they are kept in the 'journal-backup' artifact."
          exit 1

      - name: Keep the journal if it could not be pushed
        if: always() && steps.commit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: journal-backup
          path: |
            journal.db
            web/public/data
          retention-days: 30

  deploy:
    needs: cycle
    # Publish the dashboard even when the cycle failed, so the error status is visible.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the dashboard
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      # GitHub Pages sometimes answers 500 on a deployment: retry once after a pause. The job fails only if
      # the retry fails too.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
