name: cycle

on:
  schedule:
    # Hourly during the US session, minute offset from :00. The cron is in UTC and fixed: the US market
    # opens at 14:30 UTC in winter (EST) and 13:30 UTC in summer (EDT). 15:07 is the first slot with a
    # completed hourly bar in winter. In summer, change it to "7 14-19 * * 1-5".
    # Market open/closed always comes from the Alpaca clock, never from the cron.
    - cron: "7 15-20 * * 1-5"
  workflow_dispatch:
    inputs:
      resume:
        description: "Clear the halted state before running (manual resume)"
        type: boolean
        default: false
      simulate:
        description: "Dry run: one full cycle without any order, market clock ignored (kept out of the dashboard)"
        type: boolean
        default: false

# One cycle at a time: the journal is a single file committed back to the repository.
concurrency:
  group: cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RESUME: ${{ inputs.resume }}
      SIMULATE: ${{ inputs.simulate }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache Timestral weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timestral-${{ hashFiles('config.toml') }}

      - run: uv sync --frozen

      - name: Run one cycle
        run: |
          if [ "$SIMULATE" = "true" ]; then
            args="--ignore-market-clock"
          else
            args="--execute"
          fi
          if [ "$RESUME" = "true" ]; then
            args="$args --resume"
          fi
          uv run python -m agent.run --once $args

      - name: Export dashboard data (even on failure)
        if: always()
        run: uv run python -m agent.export

      - name: Commit the journal and exports (even on failure)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal.db web/public/data
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Update journal and exports ($(date -u +%Y-%m-%dT%H:%MZ))"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not push the journal and exports." >&2
          exit 1

  deploy:
    needs: cycle
    # Publish the dashboard even when the cycle failed, so the error status is visible.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the dashboard
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
